    background-size: cover; background-position: center; background-attachment: fixed;
    color: var(--text); min-height: 100vh;
  }
  .tnum { font-variant-numeric: tabular-nums; }
  .card {
    background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
    border: none; overflow: hidden;
    opacity: 0; animation: fadeInUp .35s ease forwards;
    animation-delay: calc(var(--i, 0) * 60ms);
  }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

  /* Sidebar */
  .nav-item { position: relative; display: flex; align-items: center; justify-content: center;
    width: 100%; height: 48px; color: rgba(255,255,255,0.45); text-decoration: none; transition: color .15s; }
  .nav-pill { display: flex; align-items: center; justify-content: center; width: 44px; height: 40px;
    border-radius: 8px; transition: background-color .15s; }
  .nav-item:hover .nav-pill { background-color: rgba(15,122,248,0.08); }
  .nav-item.active { color: #0f7af8; }
  .nav-item.active::after { content: ''; position: absolute; right: 0; top: 50%; transform: translateY(-50%);
    width: 3px; height: 26px; border-radius: 2px; background: #0f7af8; }
  .nav-item .tip { position: absolute; left: 72px; white-space: nowrap; background: #0f1a2e; color: #fff;
    font-size: 12px; padding: 5px 9px; border-radius: 6px; opacity: 0; pointer-events: none;
    transition: opacity .15s; box-shadow: 0 2px 8px rgba(0,0,0,0.3); z-index: 50; }
  .nav-item:hover .tip { opacity: 1; }

  /* Filter controls */
  .filter-label { font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--muted);
    letter-spacing: 0.04em; margin-bottom: 6px; }
  .filter-control { display: flex; align-items: center; justify-content: space-between;
    border: 1px solid #cfd8e4; border-radius: 10px; font-size: 13px; color: var(--text);
    padding: 8px 11px; background: #fff; cursor: default; }
  .filter-control.disabled { background: #f3f4f6; color: #b6bcc6; border-color: #e5e7eb; }

  /* Table */
  table.detail { width: 100%; border-collapse: collapse; }
  table.detail th { font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--muted);
    background: var(--zebra); text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--line); letter-spacing: .03em; }
  table.detail td { font-size: 13px; color: var(--text); padding: 9px 14px; border-bottom: 1px solid var(--line); }
  table.detail tbody tr:nth-child(even) { background: var(--zebra); }
  table.detail tbody tr:hover { background: #eff6ff; }
  .pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 999px; }
  .pill-blue { background: #dbeafe; color: #1d4ed8; }
  .pill-amber { background: #fef9c3; color: #854d0e; }
  .pill-green { background: #dcfce7; color: #16a34a; }
  .pill-red { background: #fee2e2; color: #dc2626; }
  .pill-gray { background: #f3f4f6; color: #6b7280; }
  .pill-purple { background: #ede9fe; color: #6d28d9; }
  .link-id { color: var(--accent); font-weight: 500; }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 99px; }
  ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
</style>

/* ----------------------------- measure hook ----------------------------- */
function useWidth() {
  const ref = useRef(null);
  const [w, setW] = useState(600);
  useLayoutEffect(() => {
    if (!ref.current) return;
    const ro = new ResizeObserver((entries) => {
      const cw = entries[0].contentRect.width;
      if (cw > 0) setW(cw);
    });
    ro.observe(ref.current);
    return () => ro.disconnect();
  }, []);
  return [ref, w];
}

function niceMax(v) {
  if (v <= 0) return 10;
  const pow = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v / pow;
  const step = n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10;
  return step * pow;
}

/* ----------------------------- Grouped bar chart ----------------------------- */
function GroupedBarChart({ data, series, height = 240, rotateX = false, valueLabels = false }) {
  const [ref, width] = useWidth();
  const [hover, setHover] = useState(null);
  const m = { top: valueLabels ? 24 : 16, right: 12, bottom: rotateX ? 52 : 32, left: 38 };
  const innerW = Math.max(width - m.left - m.right, 10);
  const innerH = height - m.top - m.bottom;
  const maxVal = niceMax(Math.max(...data.flatMap(d => series.map(s => d[s.key]))));
  const ticks = 4;
  const groupW = innerW / data.length;
  const barGap = 3, groupPad = Math.min(groupW * 0.22, 16);
  const bw = (groupW - groupPad * 2 - barGap * (series.length - 1)) / series.length;
  const y = (v) => m.top + innerH - (v / maxVal) * innerH;

  return (
    <div ref={ref} style={{ width: '100%' }}>
      <svg width={width} height={height} style={{ display: 'block' }}>
        {Array.from({ length: ticks + 1 }).map((_, t) => {
          const val = (maxVal / ticks) * t;
          const yy = y(val);
          return (
            <g key={t}>
              <line x1={m.left} x2={m.left + innerW} y1={yy} y2={yy} stroke="#e5e7eb" strokeWidth="1" />
              <text x={m.left - 8} y={yy + 3} textAnchor="end" fontSize="11" fill="#9ca3af">{Math.round(val)}</text>
            </g>
          );
        })}
        {data.map((d, gi) => {
          const gx = m.left + gi * groupW + groupPad;
          return (
            <g key={gi}>
              {series.map((s, si) => {
                const x = gx + si * (bw + barGap);
                const val = d[s.key];
                const yy = y(val);
                const h = m.top + innerH - yy;
                const isH = hover && hover.gi === gi && hover.si === si;
                return (
                  <g key={si}>
                    <rect x={x} y={yy} width={bw} height={Math.max(h, 0)} rx="4" fill={s.color}
                      style={{ filter: isH ? 'brightness(0.9)' : 'none', cursor: 'pointer', transition: 'filter .12s' }}
                      onMouseEnter={() => setHover({ gi, si, x: x + bw / 2, y: yy, val, label: s.label, group: d.label })}
                      onMouseLeave={() => setHover(null)} />
                    {valueLabels && <text x={x + bw / 2} y={yy - 6} textAnchor="middle" fontSize="11" fontWeight="600" fill="#6b7280">{val}</text>}
                  </g>
                );
              })}
              <text x={gx + (groupW - groupPad * 2) / 2} y={height - m.bottom + (rotateX ? 16 : 18)}
                textAnchor={rotateX ? 'end' : 'middle'} fontSize="11" fill="#9ca3af"
                transform={rotateX ? `rotate(-35 ${gx + (groupW - groupPad * 2) / 2} ${height - m.bottom + 16})` : ''}>
                {d.label}
              </text>
            </g>
          );
        })}
        {hover && (
          <g pointerEvents="none">
            <rect x={Math.min(Math.max(hover.x - 55, 2), width - 112)} y={hover.y - 42} width="110" height="34" rx="7" fill="#fff" stroke="#e5e7eb" />
            <text x={Math.min(Math.max(hover.x, 57), width - 55)} y={hover.y - 27} textAnchor="middle" fontSize="11" fill="#6b7280">{hover.group} · {hover.label}</text>
            <text x={Math.min(Math.max(hover.x, 57), width - 55)} y={hover.y - 14} textAnchor="middle" fontSize="13" fontWeight="700" fill="#111827">{hover.val}</text>
          </g>
        )}
      </svg>
    </div>
  );
}

/* ----------------------------- Area + line chart ----------------------------- */
function AreaLineChart({ data, height = 200, color = '#3b82f6', fillTop = 'rgba(59,130,246,0.18)', yLabel }) {
  const [ref, width] = useWidth();
  const [hover, setHover] = useState(null);
  const m = { top: 16, right: 16, bottom: 28, left: 38 };
  const innerW = Math.max(width - m.left - m.right, 10);
  const innerH = height - m.top - m.bottom;
  const vals = data.map(d => d.value);
  const maxVal = niceMax(Math.max(...vals));
  const minVal = 0;
  const ticks = 4;
  const x = (i) => m.left + (data.length === 1 ? innerW / 2 : (i / (data.length - 1)) * innerW);
  const y = (v) => m.top + innerH - ((v - minVal) / (maxVal - minVal)) * innerH;
  const linePts = data.map((d, i) => `${x(i)},${y(d.value)}`).join(' ');
  const areaPath = `M ${x(0)},${y(data[0].value)} ` + data.map((d, i) => `L ${x(i)},${y(d.value)}`).join(' ') +
    ` L ${x(data.length - 1)},${m.top + innerH} L ${x(0)},${m.top + innerH} Z`;
  const gid = 'g' + color.replace(/[^a-z0-9]/gi, '');

  return (
    <div ref={ref} style={{ width: '100%' }}>
      <svg width={width} height={height} style={{ display: 'block' }}>
        <defs>
          <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={fillTop} />
            <stop offset="100%" stopColor={fillTop.replace(/[\d.]+\)$/, '0)')} />
          </linearGradient>
        </defs>
        {Array.from({ length: ticks + 1 }).map((_, t) => {
          const val = (maxVal / ticks) * t; const yy = y(val);
          return (
            <g key={t}>
              <line x1={m.left} x2={m.left + innerW} y1={yy} y2={yy} stroke="#e5e7eb" strokeWidth="1" />
              <text x={m.left - 8} y={yy + 3} textAnchor="end" fontSize="11" fill="#9ca3af">{maxVal >= 20 ? Math.round(val) : val.toFixed(0)}</text>
            </g>
          );
        })}
        <path d={areaPath} fill={`url(#${gid})`} />
        <polyline points={linePts} fill="none" stroke={color} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
        {data.map((d, i) => {
          const isH = hover === i;
          return (
            <g key={i}>
              <circle cx={x(i)} cy={y(d.value)} r={isH ? 6 : 5} fill="#fff" stroke={color} strokeWidth="2"
                style={{ cursor: 'pointer' }} onMouseEnter={() => setHover(i)} onMouseLeave={() => setHover(null)} />
              <text x={x(i)} y={height - m.bottom + 16} textAnchor="middle" fontSize="11" fill="#9ca3af">{d.label}</text>
            </g>
          );
        })}
        {hover !== null && (
          <g pointerEvents="none">
            <rect x={Math.min(Math.max(x(hover) - 48, 2), width - 98)} y={y(data[hover].value) - 44} width="96" height="34" rx="7" fill="#fff" stroke="#e5e7eb" />
            <text x={Math.min(Math.max(x(hover), 50), width - 50)} y={y(data[hover].value) - 29} textAnchor="middle" fontSize="11" fill="#6b7280">{data[hover].label}</text>
            <text x={Math.min(Math.max(x(hover), 50), width - 50)} y={y(data[hover].value) - 15} textAnchor="middle" fontSize="13" fontWeight="700" fill="#111827">{data[hover].value}</text>
          </g>
        )}
        {yLabel && <text x={12} y={m.top + innerH / 2} textAnchor="middle" fontSize="10" fill="#9ca3af" transform={`rotate(-90 12 ${m.top + innerH / 2})`}>{yLabel}</text>}
      </svg>
    </div>
  );
}

/* ----------------------------- Horizontal bar list ----------------------------- */
function HBarList({ items, color = '#3b82f6' }) {
  const max = Math.max(...items.map(it => it.days));
  return (
    <div style={{ padding: '6px 18px 16px' }}>
      {items.map((it, i) => (
        <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '7px 0',
          borderBottom: i < items.length - 1 ? '1px solid #f3f4f6' : 'none' }}>
          <span className="tnum" style={{ fontSize: 11, color: '#9ca3af', width: 18, textAlign: 'right' }}>{i + 1}</span>
          <span style={{ fontSize: 13, color: '#111827', width: 200, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{it.title}</span>
          <div style={{ flex: 1, height: 6, background: '#f3f4f6', borderRadius: 99 }}>
            <div style={{ width: `${(it.days / max) * 100}%`, height: '100%', background: color, borderRadius: 99 }} />
          </div>
          <span className="tnum" style={{ fontSize: 13, fontWeight: 600, color: '#111827', width: 34, textAlign: 'right' }}>{it.days}</span>
        </div>
      ))}
    </div>
  );
}
